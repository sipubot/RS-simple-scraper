[package]
name = "textminer"
version = "1.2.13"
authors = ["SIPU <ddasik00@naver.com>"]
edition = "2024"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'abort'
strip = true
debug = false

[profile.release.package."*"]
# 외부 라이브러리들도 최대로 압축하여 빌드
opt-level = 'z'

[dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time"] } 
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] } # 최신
chrono-tz = "0.10.4"                                         # 최신
serde = { version = "1.0.229", features = ["derive"] }       # 최신
log = "0.4.34"                                               # 최신 (업데이트됨)
serde_json = "1.0.151"                                       # 최신
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks", "json"] } 
scraper = { version = "0.27.0", default-features = false }     
anyhow = "1.0.104"                                           # 최신
bytes = "1.12.1"                                             # 최신
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode-perl"] } 
url = "2.5.8"                                                # 최신
thirtyfour = "0.37.5"                                        # 최신
lazy_static = "1.5.1"                                        # 최신
futures = "0.3.34"                                           # 최신
